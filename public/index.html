function rose(fa,centerVal){
  if(!fa) return '<div style="color:#999;padding:8px">No feature-adoption data</div>';
  const N=FORDER.length,R=110,cx=170,cy=150;
  const col=v=>v==null?'#d0d5dd':(v>=75?'#137333':(v>=50?'#e0a800':'#c62828'));
  let s=`<svg width="340" height="300" viewBox="0 0 340 300">`;
  [0.25,0.5,0.75,1].forEach(g=>s+=`<circle cx="${cx}" cy="${cy}" r="${R*g}" fill="none" stroke="#eee"/>`);
  let sum=0,cnt=0;
  FORDER.forEach((lab,i)=>{const v=fa[lab];
    const a0=(i/N)*2*Math.PI-Math.PI/2,a1=((i+1)/N)*2*Math.PI-Math.PI/2;
    const rr=(v==null?6:R*v/100);
    const x0=cx+rr*Math.cos(a0),y0=cy+rr*Math.sin(a0),x1=cx+rr*Math.cos(a1),y1=cy+rr*Math.sin(a1);
    s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${col(v)}" fill-opacity="0.85" stroke="#fff"/>`;
    const am=(a0+a1)/2,lx=cx+(R+20)*Math.cos(am),ly=cy+(R+20)*Math.sin(am);
    s+=`<text x="${lx.toFixed(0)}" y="${ly.toFixed(0)}" font-size="9" text-anchor="middle" fill="#555">${lab}${v==null?'':' '+v+'%'}</text>`;
    if(v!=null){sum+=v;cnt++}});
  const avg=(centerVal!=null?Math.round(centerVal):(cnt?Math.round(sum/cnt):0));
  s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#fff" fill-opacity="0.9"/><text x="${cx}" y="${cy+2}" font-size="16" font-weight="700" text-anchor="middle">${avg}%</text><text x="${cx}" y="${cy+15}" font-size="8" text-anchor="middle" fill="#888">Feat. Adoption</text></svg>`;
  return s;
}

const SHOW_DETAIL=false;   // Revenue/Content/Affiliates card groups hidden for now (kept for later)
function statPanel(){
 const i=selMonth,p=i-1,NB=81;
 const DAYS=[31,28,31,30,31,30,31,31],days=DAYS[i];
 const B=(selBrand!=='ALL'&&BRANDMON[selBrand])?BRANDMON[selBrand]:null;
 const NBd=B?1:NB;                       // per-brand: no averaging over roster
 const g=B?B.gmv:MONTHLY.gmv, vg=B?B.vgmv:MSTAT.vgmv, lg=B?null:MSTAT.livegmv;
 const vd=B?B.videos:MONTHLY.videos, l3a=B?B.l3:MONTHLY.l3plus, cr=B?B.cre:MSTAT.creators;
 const sma=B?B.samples:MSTAT.samples, sm3=B?B.samples_l3:MSTAT.samples_l3;
 const ct=B?B.ctr:MONTHLY.ctr, cto=B?B.ctor:MSTAT.ctor, us=B?B.uniq_sampled:MSTAT.uniq_sampled, cs=B?B.cre_sales:MSTAT.creators_sales;
 const goalArr=B?B.goal:MONTHLY.gmvGoal;
 const gmv=g[i],vgmv=vg[i],vids=vd[i],l3=l3a[i],cre=cr[i],sm=sma[i],sml3=sm3[i],usmp=us[i],csale=cs[i],ctor=cto[i];
 // helpers (null-safe)
 const mo=(cur,prev)=>{ if(prev==null||prev===0||cur==null||isNaN(prev)||isNaN(cur)) return ['· no prior month',null]; const m=(cur-prev)/prev*100; return [(m>=0?'▲':'▼')+Math.abs(m).toFixed(1)+'% vs last mo.', m>=0]; };
 const rat=(a,b)=>b?a/b:null;
 const pctS=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
 const fx=(x,d)=>(x==null||!isFinite(x))?'—':x.toFixed(d);
 const goal=goalArr?goalArr[i]:null;
 const goalSub=(goal!=null&&gmv!=null)?['vs goal '+(gmv/goal*100).toFixed(0)+'% ('+M(goal)+')', gmv>=goal]:['no goal set',null];
 const ytd=g.slice(0,i+1).reduce((a,b)=>a+(b||0),0);
 const scope=B?('<span style="font-weight:500;color:#6b7280;font-size:14px"> · '+selBrand+'</span>'):'';
 let h='<h2>Monthly snapshot — '+MLAB[i]+' 2026'+scope+'</h2>';
 h+='<div class="ot" style="margin:2px 0 6px;font-weight:600">Overview</div><div class="cards">';
 if(B){ h+=statCard('Brand',selBrand,[['selected brand',null],['· '+NB+' active total',null]]); }
 else { h+=statCard('Total active brands',NB.toLocaleString(),[['brands tracked',null],['· fixed roster',null]]); }
 h+=statCard('GMV — YTD'+(B?'':' (all)'),M(ytd),[['Jan–'+MLAB[i]+' cumulative',null]]);
 const gvgSubs=(goal!=null)?[[M(gmv)+' / '+M(goal)+' goal',gmv>=goal],[(gmv>=goal?'+':'−')+M(Math.abs(gmv-goal))+(gmv>=goal?' ahead':' short'),gmv>=goal]]:[['no goal set for '+MLAB[i],null]];
 h+=statCard('Monthly GMV vs goal',(goal!=null)?(gmv/goal*100).toFixed(0)+'%':'—',gvgSubs);
 h+='</div>';
 if(SHOW_DETAIL){
 h+='<div class="ot" style="margin:8px 0 6px;font-weight:600">Revenue</div><div class="cards">';
 h+=statCard('Total GMV',M(gmv),[mo(gmv,g[p]),goalSub]);
 h+=statCard('Video GMV',M(vgmv),[mo(vgmv,vg[p]),['% of GMV: '+pctS(vgmv,gmv),null]]);
 if(lg) h+=statCard('Live GMV',M(lg[i]),[mo(lg[i],lg[p]),['% of GMV: '+pctS(lg[i],gmv),null]]);
 else h+=statCard('Live GMV','—',[['brand-level N/A',null]]);
 h+=statCard('Ad spend','—',[['no data source',null]]);
 h+=statCard('Ads ROI','—',[['no data source',null]]);
 h+='</div>';
 h+='<div class="ot" style="margin:8px 0 6px;font-weight:600">Content</div><div class="cards">';
 h+=statCard('Total affiliate videos',(vids||0).toLocaleString(),[mo(vids,vd[p]),['posted this month',null]]);
 h+=statCard('Daily VPD'+(B?'':' / brand'),fx(vids/days/NBd,1),[mo(rat(vids/days,NBd),p>=0?rat(vd[p]/DAYS[p],NBd):null),[(B?'videos / day':'videos / day / brand'),null]]);
 h+=statCard('L3+ video %',pctS(l3,vids),[mo(rat(l3,vids),p>=0?rat(l3a[p],vd[p]):null),[(l3||0).toLocaleString()+' L3+ videos',null]]);
 h+=statCard('L3+ videos'+(B?'':' / brand'),Math.round((l3||0)/NBd).toLocaleString(),[mo(rat(l3,NBd),p>=0?rat(l3a[p],NBd):null),[(B?'this brand':'avg per brand'),null]]);
 h+=statCard('CTR',fx(ct[i]*100,2)+'%',[mo(ct[i],ct[p]),['goal 3.5%',ct[i]>=0.035]]);
 h+=statCard('CTOR',fx(ctor,2)+'%',[mo(ctor,cto[p]),['click → order rate',null]]);
 h+='</div>';
 h+='<div class="ot" style="margin:8px 0 6px;font-weight:600">Affiliates & Samples</div><div class="cards">';
 h+=statCard('Samples sent',(sm||0).toLocaleString(),[mo(sm,sma[p]),[(sml3||0).toLocaleString()+' to L3+ ('+pctS(sml3,sm)+')',null]]);
 h+=statCard('Unique creators sampled',(usmp||0).toLocaleString(),[mo(usmp,us[p]),['distinct creators',null]]);
 h+=statCard('Unique creators w/ sales',(csale||0).toLocaleString(),[mo(csale,cs[p]),[pctS(csale,cre)+' of posted',null]]);
 h+=statCard('Video-to-sample ratio',fx(rat(vids,sm),2),[mo(rat(vids,sm),p>=0?rat(vd[p],sma[p]):null),['videos per sample sent',null]]);
 h+=statCard('Videos per creator',fx(rat(vids,cre),1),[mo(rat(vids,cre),p>=0?rat(vd[p],cr[p]):null),['avg videos / affiliate',null]]);
 h+=statCard('Affiliates posted',(cre||0).toLocaleString(),[mo(cre,cr[p]),['distinct creators',null]]);
 h+='</div>';
 } // end SHOW_DETAIL
 return h;
}

let selAD='All';

function tabs(){const t=document.getElementById('tabs');t.innerHTML='';['Summary',...Object.keys(TABS)].forEach(n=>{const b=document.createElement('div');b.className='tab'+(n==cur?' on':'');b.textContent=n;b.onclick=()=>{cur=n;render()};t.appendChild(b)});}
function pc(rt){return rt>=0.66?'g':(rt<=0.34?'rd':'')}
function tri(v){return v===true?'g':(v===false?'rd':(v==='am'?'am':''))}
function renderSummary(){
  document.getElementById('filterbar').style.display='none';
  const ytd=MONTHLY.gmv.reduce((a,b)=>a+b,0);
  const monthOpts=MLAB.map((m,i)=>`<option value="${i}" ${i===selMonth?'selected':''}>${m} 2026</option>`).join('');
  let h=`<div style="display:flex;gap:28px;align-items:baseline;margin:2px 0 16px;flex-wrap:wrap">
    <div><div class="ot">Month</div><select onchange="selMonth=+this.value;renderSummary()" style="padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:15px;font-weight:600">${monthOpts}</select></div></div>`;
  h+=statPanel();
  // objective cards
  function objStat(id){ const ks=KRS.filter(k=>k.obj===id&&!k.ph); if(!ks.length) return ['No data','#d0d5dd'];
    let g=0;ks.forEach(k=>{const li=lastIdx(k.v),gl=gAt(k.goal,li);if(gl!=null&&k.v[li]>=gl)g++;});
    const rt=g/ks.length; return rt>=0.66?['On Track','#34c759']:(rt>=0.34?['Risk','#e0a800']:['Off Track','#ff3b30']); }
  h+='<div class="obj">';
  h+=`<div class="ocard ${selObj==='ALL'?'on':''}" onclick="selObj='ALL';renderSummary()"><div class="ot">Overview</div><div class="on2">All Objectives</div><div class="od">Every key result across teams.</div></div>`;
  OBJS.forEach(o=>{const [st,c]=objStat(o.id);
    h+=`<div class="ocard ${selObj===o.id?'on':''}" onclick="selObj='${o.id}';renderSummary()"><div class="ot">${o.id}</div><div class="on2">${o.name}</div><div class="od">${o.desc}</div><div class="stat"><span class="dot" style="background:${c}"></span>${st}</div></div>`;});
  h+='</div>';
  h+='<h2>Key Results — monthly vs goal (2026)</h2><div class="krgrid">';
  KRS.forEach(k=>{ if(selObj!=='ALL'&&k.obj!==selObj)return; h+=krCard(k); });
  h+='</div>';
  // Ops current-state snapshot — only shown when the Ops objective card is selected
  if(selObj==='Ops'){
    const snaps=[['Ops · Binding all-4','all4'],['Ops · SKPP ≥90%','skpp'],['Ops · Feature Adoption ≥80%','adopt']];
    h+='<h2>Ops OKRs — current snapshot</h2><div class="snap">';
    snaps.forEach(([lab,key])=>{const sc=rows.filter(r=>HIT[key](r)!==null),good=rows.filter(r=>HIT[key](r)===true).length,rt=sc.length?Math.round(good/sc.length*100):0;
      h+=`<div class="scell"><div class="t">${lab}</div><div class="v">${good}/${sc.length}</div><div class="t">${rt}% hitting</div></div>`;});
    h+='</div>';
  }
  h+='<div class="legend">Orange dashed line = goal; green/red dots = month at/above vs below goal. Trends are monthly aggregates over active brands (2026). GMV goal = 1P forecast (Jun+). Placeholders await data sources.</div>';
  document.getElementById('body').innerHTML=h;
}
function okc(good){return good==null?'':(good?' g':' rd');}
function scmAgg(bs){
  const s=k=>bs.reduce((a,b)=>a+(b[k]||0),0);
  const w=k=>{let n=0,d=0;bs.forEach(b=>{if(b[k]!=null&&b.videos){n+=b[k]*b.videos;d+=b.videos;}});return d?n/d:null;};
  const sgmv=s('gmv'),sgoal=s('goal'),simp=s('imp'),sclk=s('clk'),sord=s('orders'),sviews=s('views'),sall=s('allvid'),saff=s('affvgmv');
  return {n:bs.length,gmv:sgmv,goal:sgoal,att:sgoal?sgmv/sgoal:null,affvgmv:saff,videos:s('videos'),vpd:s('vpd'),
    l3pct:w('l3pct'),ctr:simp?sclk/simp:null,ctor:sclk?sord/sclk*100:null,views:sviews,avv:sall?sviews/sall:null,orders:sord,aov:sord?saff/sord:null};
}
function cptN(v){return v>=1e6?(v/1e6).toFixed(1)+'M':(v>=1e3?Math.round(v/1e3)+'K':''+Math.round(v));}
function podRow(label,a,sel,oc){
  const attw=a.att==null?0:Math.min(a.att,1)*100;
  const bc=a.att==null?'#c9ced6':(a.att>=1?'#5aa544':(a.att>=0.8?'#e0a800':'#e06c4f'));
  return `<tr class="clk${sel?' podsel':''}" ${oc}>`+
    `<td><b>${label}</b></td><td class="num">${a.n}</td>`+
    `<td class="num">${a.goal?'$'+Math.round(a.goal).toLocaleString():'—'}</td>`+
    `<td><div class="gbar"><div class="gbf" style="width:${attw.toFixed(0)}%;background:${bc}"></div><span>${a.att==null?'—':(a.att*100).toFixed(0)+'%'}</span></div></td>`+
    `<td class="num">$${Math.round(a.gmv).toLocaleString()}</td>`+
    `<td class="num">$${Math.round(a.affvgmv).toLocaleString()}</td>`+
    `<td class="num">${a.videos.toLocaleString()}</td>`+
    `<td class="num">${a.n?(a.vpd/a.n).toFixed(1):'—'}</td>`+
    `<td class="num">${a.ctr==null?'—':(a.ctr*100).toFixed(2)+'%'}</td>`+
    `<td class="num">${a.ctor==null?'—':a.ctor.toFixed(2)+'%'}</td>`+

function scmPods(){

  SCMFULL.forEach(r=>{if(r.ad&&r.ad!=='(Unassigned)')(pods[r.ad]=pods[r.ad]||[]).push(r)});
  const ads=Object.keys(pods).sort((a,b)=>scmAgg(pods[b]).gmv-scmAgg(pods[a]).gmv);

  const up=v[v.length-1]>=v[0], col=up?'#34a853':'#e0553e', last=pts[pts.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.1" fill="${col}"/></svg>`;
