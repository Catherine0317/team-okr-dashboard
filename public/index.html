  if(!fa) return '<div style="color:#999;padding:8px">No feature-adoption data</div>';
  const N=FORDER.length,R=110,cx=170,cy=150;
  const col=v=>v==null?'#d0d5dd':(v>=75?'#137333':(v>=50?'#e0a800':'#c62828'));
  let s=`<svg width="340" height="300" viewBox="0 0 340 300">`;
  [0.25,0.5,0.75,1].forEach(g=>s+=`<circle cx="${cx}" cy="${cy}" r="${R*g}" fill="none" stroke="#eee"/>`);
  let sum=0,cnt=0;
  FORDER.forEach((lab,i)=>{const v=fa[lab];
    const a0=(i/N)*2*Math.PI-Math.PI/2,a1=((i+1)/N)*2*Math.PI-Math.PI/2;
    const rr=(v==null?6:R*v/100);
    const x0=cx+rr*Math.cos(a0),y0=cy+rr*Math.sin(a0),x1=cx+rr*Math.cos(a1),y1=cy+rr*Math.sin(a1);
    s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${col(v)}" fill-opacity="0.85" stroke="#fff"/>`;
    const am=(a0+a1)/2,lx=cx+(R+20)*Math.cos(am),ly=cy+(R+20)*Math.sin(am);
    s+=`<text x="${lx.toFixed(0)}" y="${ly.toFixed(0)}" font-size="9" text-anchor="middle" fill="#555">${lab}${v==null?'':' '+v+'%'}</text>`;
    if(v!=null){sum+=v;cnt++}});
  const avg=(centerVal!=null?Math.round(centerVal):(cnt?Math.round(sum/cnt):0));
  s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#fff" fill-opacity="0.9"/><text x="${cx}" y="${cy+2}" font-size="16" font-weight="700" text-anchor="middle">${avg}%</text><text x="${cx}" y="${cy+15}" font-size="8" text-anchor="middle" fill="#888">Feat. Adoption</text></svg>`;
  return s;
}

function krbars(vals,goal,zoom,fmt){
 const N=12,W=300,H=84,pad=6,labels=['J','F','M','A','M','J','J','A','S','O','N','D'];
 const MOF=['January','February','March','April','May','June','July','August','September','October','November','December'];
 const nn=vals.filter(v=>v!=null),ga=(goal==null)?[]:(Array.isArray(goal)?goal.filter(x=>x!=null):[goal]);
 const bw=(W-2*pad)/N;const cur=lastIdx(vals);
 // zoom: scale to the VALUE range only (goal may sit above frame) so small month-to-month variation is visible
 let mn=0, mx=Math.max(...nn,...ga,1)*1.12;
 if(zoom){ mn=Math.min(...nn)*0.985; mx=Math.max(...nn)*1.015; }
 const rng=(mx-mn)||1;
 const yOf=v=>Math.max(2,Math.min(H,H-((v-mn)/rng)*(H-8)));
 let s=`<svg width="100%" height="${H+22}" viewBox="0 0 ${W} ${H+22}" preserveAspectRatio="xMidYMid meet">`;
 if(goal!=null&&!Array.isArray(goal)){const gy=yOf(goal);s+=`<line x1="${pad}" y1="${gy.toFixed(1)}" x2="${W-pad}" y2="${gy.toFixed(1)}" stroke="#f0883e" stroke-dasharray="4 3" stroke-width="1.4"/>`;}
 vals.forEach((v,i)=>{ if(v==null)return; const y=yOf(v),bh=Math.max(0,H-y),x=pad+i*bw+2,isc=i===cur;
  const gg=gAt(goal,i),tip=MOF[i]+': '+(fmt?fmt(v):v)+(gg!=null?'  (goal '+(fmt?fmt(gg):gg)+')':'');
  s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${isc?'#4f46e5':'#cdd2da'}"><title>${tip}</title></rect>`;
  const g=gAt(goal,i),dc=g==null?'#c9ced6':(v>=g?'#34c759':'#ff3b30');
  s+=`<circle cx="${(x+(bw-4)/2).toFixed(1)}" cy="${H+7}" r="2.6" fill="${dc}"/>`;
  if(Array.isArray(goal)&&g!=null){const gy=yOf(g);s+=`<line x1="${x.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${(x+bw-4).toFixed(1)}" y2="${gy.toFixed(1)}" stroke="#f0883e" stroke-dasharray="3 2"/>`;}});

 return s+'</svg>';
}

function spark(vals){
  const v=vals.map(x=>(x==null||isNaN(x))?0:x); const mx=Math.max(...v),mn=Math.min(...v),rng=(mx-mn)||1;
  const W=84,H=22; const pts=v.map((x,i)=>[6+i*((W-12)/4), H-3-((x-mn)/rng)*(H-7)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const up=v[v.length-1]>=v[0], col=up?'#34a853':'#e0553e', last=pts[pts.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.1" fill="${col}"/></svg>`;
}
